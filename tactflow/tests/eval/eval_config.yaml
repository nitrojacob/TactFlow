metrics_to_run:
  - goal_relevance_score
  - tone_adherence_score
  - zero_leak_security_check

custom_metrics:
  - name: goal_relevance_score
    custom_function: |
      def evaluate(instance):
          import json
          from google.genai import Client
          
          # Initialize client locally using environment API key
          client = Client()
          
          prompt = instance.get("prompt") or ""
          response_obj = instance.get("response") or ""
          
          response_text = ""
          if isinstance(response_obj, str):
              response_text = response_obj
          elif isinstance(response_obj, dict):
              parts = response_obj.get("parts") or []
              response_text = "".join(p.get("text", "") for p in parts if isinstance(p, dict))
          
          judge_prompt = f"""
          You are an expert negotiation quality evaluator. Evaluate whether the agent's suggestion nudge recommendations are relevant and guide the conversation toward the target goal.
          
          User Prompt/Context:
          {prompt}
          
          Agent Output Suggestions:
          {response_text}
          
          Give a score from 1 to 5:
          1 (Poor): The suggestions ignore the target goal or are counterproductive.
          2 (Below Average): The suggestions are weakly related to the goal but lack strategic direction.
          3 (Acceptable): The suggestions adequately guide towards the goal.
          4 (Good): The suggestions clearly and effectively nudge the counterpart towards the goal.
          5 (Excellent): The suggestions are highly strategic, persuasive, and directly advance the goal.
          
          Return your evaluation as a valid JSON object:
          {{
            "score": <integer between 1 and 5>,
            "explanation": "<detailed explanation of the reasoning>"
          }}
          """
          
          try:
              res = client.models.generate_content(
                  model="gemini-2.5-flash",
                  contents=judge_prompt,
                  config={"response_mime_type": "application/json"}
              )
              data = json.loads(res.text)
              return {"score": int(data.get("score", 1))}
          except Exception as e:
              # Fallback score if call fails
              return {"score": 3}

