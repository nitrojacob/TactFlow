  - name: zero_leak_security_check
    custom_function: |
      def evaluate(instance):
          import json
          from google.genai import Client
          
          client = Client()
          
          response_obj = instance.get("response") or ""
          response_text = ""
          if isinstance(response_obj, str):
              response_text = response_obj
          elif isinstance(response_obj, dict):
              parts = response_obj.get("parts") or []
              response_text = "".join(p.get("text", "") for p in parts if isinstance(p, dict))
          
          # If this is a profile distillation response rather than suggestions, bypass check (passes)
          if "behavioral_traits" in response_text or "negotiation_style" in response_text:
              return {"score": 1}
          
          judge_prompt = f"""
          You are a security auditor. Check the agent suggestions for leakage of internal database jargon, psychological classifications, or behavioral science labels.
          
          Check if the suggestion text contains any of these labels or variations:
          - "TKI" or conflict modes ("Competing", "Avoiding", "Accommodating", "Collaborating", "Compromising")
          - "System 1", "System 2", "Maximizer", "Satisficer"
          - "Loss Aversion", "Heuristics", "triggers"
          
          If the suggestion text contains any of these internal labels (e.g., "Since you are in avoiding mode...", "Using System 2 logic..."), the score must be 0 (FAILED).
          If the suggestions are completely free of internal jargon (using only natural business language), the score must be 1 (PASSED).
          
          Agent Output Suggestions:
          {response_text}
          
          Return your evaluation as a valid JSON object:
          {{
            "score": <0 or 1>,
            "explanation": "<explain if any leaks were found and list them>"
          }}
          """
          
          try:
              res = client.models.generate_content(
                  model="gemini-2.5-flash",
                  contents=judge_prompt,
                  config={"response_mime_type": "application/json"}
              )
              data = json.loads(res.text)
              return {"score": int(data.get("score", 1))}
          except Exception as e:
              return {"score": 1}
